aid: garner-health
name: Garner Health
description: >-
  Garner Health is a healthcare technology company that helps members find high-quality,
  in-network doctors and helps employers, benefits advisors, health plans, and providers
  improve care quality while lowering healthcare costs. Garner analyzes more than 60 billion
  de-identified medical records from 320M+ patients and scores providers on 550+
  specialty-specific quality and efficiency metrics across 80+ specialties to identify Top
  Providers. Its provider-recommendation API returns rank-ordered providers, professional and
  facility detail, and a provider-annotation endpoint over the base host api.getgarner.com,
  authenticated with OAuth 2.0 client credentials. Garner is SOC 2 Type II certified.
